{
  "name": "staging-secrets",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "worker": {
          "description": "Which staging Worker",
          "required": true,
          "type": "choice",
          "options": [
            "accounts-staging",
            "run-staging"
          ],
          "default": "accounts-staging"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "set-staging-secrets": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read"
      },
      "environment": "staging",
      "concurrency": {
        "group": "accounts-deploy-staging",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Set the missing secrets of the chosen staging Worker (generated on this runner, never printed)",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}",
            "GITHUB_CLIENT_SECRET": "${{ secrets.APP_CLIENT_SECRET }}",
            "WORKER": "${{ inputs.worker }}"
          },
          "run": "node tools/worker-secrets.mjs \"$WORKER\""
        }
      ]
    }
  }
}
