{
  "name": "accounts-mutation",
  "on": {
    "schedule": [
      {
        "cron": "37 23 * * 0",
        "timezone": "America/New_York"
      }
    ],
    "workflow_dispatch": {
      "inputs": {
        "full": {
          "description": "Force all mutants (ignore cached results)",
          "type": "boolean",
          "default": true,
          "required": true
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "mutation": {
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 180,
      "permissions": {
        "contents": "read"
      },
      "outputs": {
        "below": "${{ steps.mutation.outputs.below }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Enable pinned pnpm",
          "run": "corepack enable"
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "pnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Restore branch mutation report, falling back to main",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": "reports/stryker-incremental.json\nreports/mutation-context.txt",
            "key": "accounts-mutation-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "restore-keys": "accounts-mutation-v1-${{ runner.os }}-${{ github.ref_name }}-\naccounts-mutation-v1-${{ runner.os }}-main-"
          },
          "if": "github.event_name == 'workflow_dispatch' && !inputs.full"
        },
        {
          "name": "Run full weekly or selected manual mutation mode",
          "id": "mutation",
          "env": {
            "MUTATION_FULL": "${{ github.event_name == 'schedule' || inputs.full }}"
          },
          "run": "if [ \"$MUTATION_FULL\" = \"true\" ]; then\n  pnpm mutation\nelse\n  pnpm mutation:quick\nfi"
        },
        {
          "name": "Save complete mutation results",
          "if": "!cancelled() && github.ref == 'refs/heads/main' && steps.mutation.outputs.cacheable == 'true'",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": "reports/stryker-incremental.json\nreports/mutation-context.txt",
            "key": "accounts-mutation-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}"
          }
        },
        {
          "name": "Upload mutation report and survivors",
          "if": "!cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "mutation-report",
            "path": "reports/release-mutation.json\nreports/release-mutation.html\nreports/mutation-issue.md",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    },
    "report": {
      "needs": [
        "mutation"
      ],
      "if": "!cancelled() && github.ref == 'refs/heads/main' && needs.mutation.outputs.below == 'true'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "read",
        "issues": "write"
      },
      "concurrency": {
        "group": "accounts-mutation-score-issue",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "mutation-report",
            "path": "reports"
          }
        },
        {
          "name": "Open or update the mutation score issue",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "node tools/mutation/issue.mjs"
        }
      ]
    }
  }
}
