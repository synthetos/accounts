{
  "name": "production-secrets",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "worker": {
          "description": "Which production Worker",
          "required": true,
          "type": "choice",
          "options": [
            "accounts",
            "run"
          ],
          "default": "accounts"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "set-production-secrets": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read"
      },
      "environment": "production",
      "concurrency": {
        "group": "accounts-deploy-production",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Set missing accounts production secrets (values never printed)",
          "if": "inputs.worker == 'accounts'",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}",
            "WORKER": "${{ inputs.worker }}",
            "GITHUB_CLIENT_SECRET": "${{ secrets.APP_CLIENT_SECRET }}",
            "OAUTH_STATE_KEY": "${{ secrets.OAUTH_STATE_KEY }}",
            "FORM_KEY": "${{ secrets.FORM_KEY }}",
            "RATE_KEY": "${{ secrets.RATE_KEY }}",
            "GITHUB_WEBHOOK_SECRET": "${{ secrets.APP_WEBHOOK_SECRET }}",
            "ID_TOKEN_PRIVATE_JWK": "${{ secrets.ID_TOKEN_PRIVATE_JWK }}"
          },
          "run": "node tools/worker-secrets.mjs \"$WORKER\""
        },
        {
          "name": "Set missing run production secrets (values never printed)",
          "if": "inputs.worker == 'run'",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}",
            "WORKER": "${{ inputs.worker }}",
            "RUN_STATE_KEY": "${{ secrets.RUN_STATE_KEY }}",
            "RUN_RATE_KEY": "${{ secrets.RUN_RATE_KEY }}"
          },
          "run": "node tools/worker-secrets.mjs \"$WORKER\""
        }
      ],
      "if": "github.ref == 'refs/heads/main'"
    }
  }
}
