{
  "name": "accounts-ci",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Enable pinned pnpm",
          "run": "corepack enable"
        },
        {
          "name": "Install locked dependencies without lifecycle scripts",
          "run": "pnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Typecheck",
          "run": "pnpm typecheck"
        },
        {
          "name": "Lint",
          "run": "pnpm lint"
        },
        {
          "name": "Dependency boundaries",
          "run": "pnpm deps"
        },
        {
          "name": "Dependency licences",
          "run": "pnpm licence"
        },
        {
          "name": "Unit and policy tests",
          "run": "pnpm test"
        },
        {
          "name": "Auth, provider and Worker mutation score >=90",
          "run": "pnpm mutation"
        },
        {
          "name": "Install local D1 test toolchain",
          "run": "pnpm --dir ci/deploy-toolchain install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "D1 migrations on local workerd",
          "run": "pnpm test:d1",
          "env": {
            "WRANGLER_SEND_METRICS": "false"
          }
        }
      ]
    },
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "path": "a"
          }
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "path": "b"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Enable pinned pnpm",
          "run": "corepack enable"
        },
        {
          "name": "Install only TypeScript in each clean checkout",
          "run": "pnpm --dir a/ci/build-toolchain install --frozen-lockfile --ignore-scripts\npnpm --dir b/ci/build-toolchain install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Build first checkout",
          "run": "cd a\nnode tools/build.mjs dist ci/build-toolchain/node_modules/typescript/bin/tsc"
        },
        {
          "name": "Build second checkout",
          "run": "cd b\nnode tools/build.mjs dist ci/build-toolchain/node_modules/typescript/bin/tsc"
        },
        {
          "name": "Require byte-identical outputs",
          "run": "node a/tools/artifact.mjs compare a/dist b/dist"
        },
        {
          "name": "Package exact artifact",
          "run": "mkdir artifact\ntar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --format=posix --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime -cf artifact/accounts-worker.tar -C a/dist ."
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "accounts-worker",
            "path": "artifact/accounts-worker.tar",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "e2e": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "accounts-worker",
            "path": "artifact"
          }
        },
        {
          "name": "Smoke test the actual artifact (foundation Worker)",
          "run": "mkdir payload\ntar -xf artifact/accounts-worker.tar -C payload\nnode --input-type=module -e 'import { createApp } from \"./payload/workers/accounts/src/app.js\"; const worker = createApp(); const r = await worker.fetch(new Request(\"https://accounts.test/\")); if (r.status !== 503 || r.headers.get(\"Cache-Control\") !== \"no-store\") process.exit(1);'"
        }
      ],
      "needs": [
        "build"
      ]
    },
    "attest": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read",
        "id-token": "write",
        "attestations": "write"
      },
      "steps": [
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "accounts-worker",
            "path": "artifact"
          }
        },
        {
          "uses": "actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8",
          "with": {
            "subject-path": "artifact/accounts-worker.tar"
          }
        }
      ],
      "needs": [
        "verify",
        "build",
        "e2e",
        "browser"
      ],
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/main'"
    },
    "deploy-staging": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Enable pinned pnpm",
          "run": "corepack enable"
        },
        {
          "name": "Install pinned deploy-only toolchain",
          "run": "pnpm --dir ci/deploy-toolchain install --frozen-lockfile --ignore-scripts"
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "accounts-worker",
            "path": "artifact"
          }
        },
        {
          "name": "Verify attestation for this commit and trusted workflow",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh attestation verify artifact/accounts-worker.tar --repo \"$GITHUB_REPOSITORY\" --signer-workflow \"$GITHUB_REPOSITORY/.github/workflows/ci.yml\" --source-ref refs/heads/main --source-digest \"$GITHUB_SHA\" --deny-self-hosted-runners"
        },
        {
          "name": "Extract verified artifact",
          "run": "mkdir payload\ntar -xf artifact/accounts-worker.tar -C payload"
        },
        {
          "name": "Staging must already be behind Cloudflare Access (D31)",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "node tools/access-check.mjs --pre-deploy"
        },
        {
          "name": "Preflight: the environment is fully configured (A1-07)",
          "run": "node tools/deploy-preflight.mjs payload/wrangler.json staging"
        },
        {
          "name": "Apply reviewed expand migrations before code",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_D1_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "ci/deploy-toolchain/node_modules/.bin/wrangler d1 migrations apply IDENTITY --remote --config payload/wrangler.json --env staging"
        },
        {
          "name": "Register the run relying party for this environment (A1-07)",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_D1_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "ci/deploy-toolchain/node_modules/.bin/wrangler d1 execute IDENTITY --remote --config payload/wrangler.json --env staging --file payload/clients/staging.sql"
        },
        {
          "name": "Deploy verified artifact without rebuilding",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "ci/deploy-toolchain/node_modules/.bin/wrangler deploy --no-bundle --config payload/wrangler.json --env staging",
          "id": "deploy"
        },
        {
          "name": "Post-deploy: staging is behind Cloudflare Access (D31)",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "node tools/access-check.mjs --post-deploy"
        },
        {
          "name": "Undo: delete staging when a step after the deploy failed",
          "if": "failure() && steps.deploy.outcome == 'success'",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "ci/deploy-toolchain/node_modules/.bin/wrangler delete --config payload/wrangler.json --env staging --force"
        }
      ],
      "needs": [
        "verify",
        "build",
        "e2e",
        "attest",
        "browser"
      ],
      "environment": "staging",
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ACCOUNTS_DEPLOY_ENABLED == 'true'",
      "concurrency": {
        "group": "accounts-deploy-staging",
        "cancel-in-progress": false
      }
    },
    "deploy-production": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Enable pinned pnpm",
          "run": "corepack enable"
        },
        {
          "name": "Install pinned deploy-only toolchain",
          "run": "pnpm --dir ci/deploy-toolchain install --frozen-lockfile --ignore-scripts"
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "accounts-worker",
            "path": "artifact"
          }
        },
        {
          "name": "Verify attestation for this commit and trusted workflow",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh attestation verify artifact/accounts-worker.tar --repo \"$GITHUB_REPOSITORY\" --signer-workflow \"$GITHUB_REPOSITORY/.github/workflows/ci.yml\" --source-ref refs/heads/main --source-digest \"$GITHUB_SHA\" --deny-self-hosted-runners"
        },
        {
          "name": "Extract verified artifact",
          "run": "mkdir payload\ntar -xf artifact/accounts-worker.tar -C payload"
        },
        {
          "name": "Preflight: the environment is fully configured (A1-07)",
          "run": "node tools/deploy-preflight.mjs payload/wrangler.json production"
        },
        {
          "name": "Apply reviewed expand migrations before code",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_D1_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "ci/deploy-toolchain/node_modules/.bin/wrangler d1 migrations apply IDENTITY --remote --config payload/wrangler.json"
        },
        {
          "name": "Register the run relying party for this environment (A1-07)",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_D1_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "ci/deploy-toolchain/node_modules/.bin/wrangler d1 execute IDENTITY --remote --config payload/wrangler.json --file payload/clients/production.sql"
        },
        {
          "name": "Deploy verified artifact without rebuilding",
          "env": {
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
          },
          "run": "ci/deploy-toolchain/node_modules/.bin/wrangler deploy --no-bundle --config payload/wrangler.json"
        }
      ],
      "needs": [
        "verify",
        "build",
        "e2e",
        "attest",
        "deploy-staging",
        "browser"
      ],
      "environment": "production",
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ACCOUNTS_DEPLOY_ENABLED == 'true'",
      "concurrency": {
        "group": "accounts-deploy-production",
        "cancel-in-progress": false
      }
    },
    "browser": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "needs": [
        "build"
      ],
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "name": "Enable pinned pnpm",
          "run": "corepack enable"
        },
        {
          "name": "Install local Worker runtime",
          "run": "pnpm --dir ci/deploy-toolchain install --frozen-lockfile --ignore-scripts"
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "accounts-worker",
            "path": "artifact"
          }
        },
        {
          "name": "Extract exact build artifact",
          "run": "mkdir payload\ntar -xf artifact/accounts-worker.tar -C payload"
        },
        {
          "name": "Install pinned, hash-checked browser dependencies",
          "run": "python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'\npython3 -m venv .browser-venv\n.browser-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r test/browser/requirements.txt\n.browser-venv/bin/python -m playwright install --with-deps chromium"
        },
        {
          "name": "Check browser tool licences",
          "run": ".browser-venv/bin/python test/browser/licences.py | node test/browser/check-licences.mjs"
        },
        {
          "name": "Real Chromium login and account form controls",
          "run": ".browser-venv/bin/python test/browser/run.py",
          "env": {
            "BROWSER_ARTIFACT_DIR": "payload",
            "WRANGLER_SEND_METRICS": "false"
          }
        }
      ]
    }
  }
}
